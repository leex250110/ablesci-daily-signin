name: AbleSci 每日签到

on:
  schedule:
    # 每天 00:00 UTC = 北京时间 08:00 触发。
    # 注意：这只是"触发时刻"，不是"签到时刻"。实测 GitHub 免费版会把它
    # 推迟 1.6 ~ 10.9 小时不等，且成段稳定（连续多天落在同一偏移上）。
    # 脚本内的 ABLESCI_JITTER_MAX 会在此基础上再叠加随机延迟。
    - cron: "0 0 * * *"
  workflow_dispatch: # 允许在网页上手动触发

# 最小权限：本任务只需要读仓库
permissions:
  contents: read

# 避免手动触发和定时触发撞在一起
concurrency:
  group: ablesci-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    # 需要容纳 ABLESCI_JITTER_MAX 的随机延迟（默认最多 25 分钟）
    timeout-minutes: 60

    # 想加人只需在这里补两行，并在仓库 Secrets 里加对应的值。
    # 没配置的槽位会是空字符串，脚本会自动跳过。
    env:
      TZ: Asia/Shanghai
      # 定时触发的随机延迟窗口（秒）。1500 = 最多等 25 分钟。
      # 仅对 schedule 生效，手动 Run workflow 不会空等。设为 0 可关闭。
      ABLESCI_JITTER_MAX: "1500"
      ABLESCI_1_EMAIL: ${{ secrets.ABLESCI_1_EMAIL }}
      ABLESCI_1_PASSWORD: ${{ secrets.ABLESCI_1_PASSWORD }}
      ABLESCI_2_EMAIL: ${{ secrets.ABLESCI_2_EMAIL }}
      ABLESCI_2_PASSWORD: ${{ secrets.ABLESCI_2_PASSWORD }}
      ABLESCI_3_EMAIL: ${{ secrets.ABLESCI_3_EMAIL }}
      ABLESCI_3_PASSWORD: ${{ secrets.ABLESCI_3_PASSWORD }}
      ABLESCI_4_EMAIL: ${{ secrets.ABLESCI_4_EMAIL }}
      ABLESCI_4_PASSWORD: ${{ secrets.ABLESCI_4_PASSWORD }}
      ABLESCI_5_EMAIL: ${{ secrets.ABLESCI_5_EMAIL }}
      ABLESCI_5_PASSWORD: ${{ secrets.ABLESCI_5_PASSWORD }}
      # 兼容旧的单账号写法（可留空）
      ABLESCI_EMAIL: ${{ secrets.ABLESCI_EMAIL }}
      ABLESCI_PASSWORD: ${{ secrets.ABLESCI_PASSWORD }}

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 站点自检（确认 CSRF 抓取逻辑没被改版打断）
        run: python ablesci_signin.py --check

      - name: 执行签到
        run: python ablesci_signin.py
